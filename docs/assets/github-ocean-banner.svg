    <path class="foam-swell" d="M46 254C112 257 150 247 205 232C264 217 304 235 357 224C408 213 454 191 518 190" fill="none" stroke="#80dbe9" stroke-opacity=".28" stroke-width="7" stroke-linecap="round"/>
  </g>
