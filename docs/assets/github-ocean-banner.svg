<svg viewBox="0 0 720 240" role="img" aria-labelledby="boost-title boost-desc" xmlns="http://www.w3.org/2000/svg">
  <title id="boost-title">DockerBoost racing across ocean waves</title>
  <desc id="boost-desc">The Docker whale rides a surfboard across an ocean wave beneath a blue twilight sky.</desc>
  <style>
    .wave-static { display: none; }
    .ocean-glow { animation: ocean-breathe 3.3s ease-in-out infinite; }
    .foam-swell { animation: foam-shimmer 2.2s ease-in-out infinite; }
    .surfer-motion { transform-box: view-box; transform-origin: 265px 203px; filter: drop-shadow(0 7px 8px #022e4880); animation: surf-ride 2.2s ease-in-out infinite; }
    .wake path { animation: wake-flow 1.35s ease-out infinite; }
    .wake path:nth-child(2) { animation-delay: .18s; }
    .wake path:nth-child(3) { animation-delay: .36s; }
    .sea-spray circle { animation: spray 1.8s ease-out infinite; }
    .sea-spray circle:nth-child(2n) { animation-delay: .55s; }
    .sea-spray circle:nth-child(3n) { animation-delay: 1s; }
    @keyframes ocean-breathe { 0%,100% { opacity: .55; transform: scale(.96); } 50% { opacity: 1; transform: scale(1.03); } }
    @keyframes foam-shimmer { 0%,100% { opacity: .45; } 50% { opacity: .85; } }
    @keyframes surf-ride { 0%,100% { transform: translate(-3px,2px) rotate(-1.8deg); } 50% { transform: translate(5px,-7px) rotate(1.8deg); } }
    @keyframes wake-flow { 0% { opacity: 0; transform: translateX(-34px); } 30% { opacity: .8; } 100% { opacity: 0; transform: translateX(37px); } }
    @keyframes spray { 0% { opacity: 0; transform: translate(-16px,4px); } 35% { opacity: .8; } 100% { opacity: 0; transform: translate(21px,-14px); } }
    @media (prefers-reduced-motion: reduce) {
      .wave-animated { display: none; }
      .wave-static { display: inline; }
      .ocean-glow,.foam-swell,.surfer-motion,.wake path,.sea-spray circle { animation: none; }
    }
  </style>
  <defs>
    <linearGradient id="ocean-blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b8cb6"/><stop offset=".5" stop-color="#0a648b"/><stop offset="1" stop-color="#06314e"/></linearGradient>
    <linearGradient id="wave-foam" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#4bbcd8" stop-opacity=".1"/><stop offset=".45" stop-color="#c5f8ff"/><stop offset="1" stop-color="#7ddbe9" stop-opacity=".62"/></linearGradient>
    <linearGradient id="surfboard-color" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f2fdff"/><stop offset=".6" stop-color="#a9eaf8"/><stop offset="1" stop-color="#52bcd9"/></linearGradient>
    <linearGradient id="whale-blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#8de9ff"/><stop offset=".48" stop-color="#3ecbfa"/><stop offset="1" stop-color="#0796df"/></linearGradient>
    <radialGradient id="ocean-glow"><stop stop-color="#1cc3eb" stop-opacity=".25"/><stop offset="1" stop-color="#1cc3eb" stop-opacity="0"/></radialGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#075577"/><stop offset=".52" stop-color="#0d7390"/><stop offset="1" stop-color="#063d63"/></linearGradient>
    <radialGradient id="horizon"><stop stop-color="#9cecf6" stop-opacity=".22"/><stop offset="1" stop-color="#45d6ef" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="720" height="240" rx="20" fill="url(#sky)"/>
  <ellipse cx="365" cy="136" rx="280" ry="120" fill="url(#horizon)"/>
  <path d="M0 171C120 152 176 176 260 171S440 151 533 166 668 178 720 164V240H0Z" fill="#0a4b63" opacity=".32"/>
  <path d="M0 201C110 183 183 211 284 201S445 183 544 200 658 207 720 196V240H0Z" fill="#03263d" opacity=".65"/>
  <g fill="none" stroke="#a9edfa" stroke-linecap="round" opacity=".24">
    <path d="M60 137h42m-15 8h28M583 137h55m-35 9h29M82 189h47m459-7h54"/>
  </g>
