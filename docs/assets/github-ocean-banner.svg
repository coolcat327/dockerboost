    <path class="sea-body wave-static" d="M22 248C84 244 130 232 166 211C206 187 214 166 257 166C298 165 317 192 350 201C407 217 470 177 538 184C513 211 478 238 427 250C364 268 315 253 255 261C167 277 86 273 22 248Z" fill="url(#ocean-blue)"/>
